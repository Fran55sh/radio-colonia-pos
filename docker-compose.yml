# Stack local POS — misma DB que el ecommerce (contenedor radiocolonia-db).
# Levantá primero: cd "../Radio Colonia/app" && docker compose up -d
#
# Contenedores (docker ps):
#   radiocolonia-pos-api  → Backend API (3001)
#   radiocolonia-pos-web  → Frontend Vite (5173)
#   radiocolonia-db       → Postgres compartido (compose ecommerce, :5433)

name: radiocolonia-pos

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: radiocolonia-pos-api
    restart: unless-stopped
    environment:
      DB_HOST: radiocolonia-db
      DB_PORT: 5432
      DB_USER: radiocolonia
      DB_PASSWORD: radiocolonia_secret
      DB_NAME: radiocolonia_db
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      POS_ACCESS_PIN: "${POS_ACCESS_PIN:-change-me-caja-pin}"
      POS_ADMIN_PIN: "${POS_ADMIN_PIN:-change-me-admin-pin}"
      POS_DEFAULT_ROLE: "${POS_DEFAULT_ROLE:-caja}"
      POS_JWT_SECRET: "${POS_JWT_SECRET:-change-me-jwt-secret-min-16}"
      POS_SESSION_HOURS: "12"
      ARCA_ENABLED: ${ARCA_ENABLED:-false}
      ARCA_PRODUCTION: ${ARCA_PRODUCTION:-false}
      ARCA_CUIT: ${ARCA_CUIT:-}
      ARCA_PTO_VTA: ${ARCA_PTO_VTA:-1}
      ARCA_CERT: ${ARCA_CERT:-}
      ARCA_KEY: ${ARCA_KEY:-}
      ARCA_CERT_PATH: ${ARCA_CERT_PATH:-}
      ARCA_KEY_PATH: ${ARCA_KEY_PATH:-}
    ports:
      - "3001:3001"
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - default
      - ecommerce

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: development
    container_name: radiocolonia-pos-web
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend/src:/app/src

networks:
  ecommerce:
    external: true
    name: radiocolonia-ecommerce_default
