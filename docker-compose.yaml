# Coolify / producción — mismo contenido que docker-compose.coolify.yml
# En Coolify: Base Directory = /  |  Docker Compose Location = /docker-compose.yaml
# Desarrollo local: usar docker-compose.yml (no este archivo).
# Ver docs/DEPLOY.md

name: radiocolonia-pos-coolify

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Sin mapeo al host: Coolify enruta por red coolify (evita choque con ecommerce en :3000).
    expose:
      - "3001"
    networks:
      - coolify
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    environment:
      NODE_ENV: production
      POS_SEED_DEMO: "false"
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT:-5432}
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN}
      API_TOKEN: ${API_TOKEN:-}
      POS_ACCESS_PIN: ${POS_ACCESS_PIN}
      POS_JWT_SECRET: ${POS_JWT_SECRET}
      POS_SESSION_HOURS: ${POS_SESSION_HOURS:-12}

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_PROXY_TARGET: http://backend:3001
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - coolify
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      VITE_PROXY_TARGET: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy

networks:
  coolify:
    external: true
